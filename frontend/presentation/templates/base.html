<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Система знаний команды{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 600; }
    pre.json-block {
      background: #212529;
      color: #f8f9fa;
      padding: 1rem;
      border-radius: 0.375rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.875rem;
    }
    .badge-review { font-size: 0.75rem; }
    .quote-block {
      border-left: 3px solid #0d6efd;
      padding-left: 0.75rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/documents">Система знаний</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link{% if active == 'documents' %} active{% endif %}" href="/documents">Документы</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if active == 'questions' %} active{% endif %}" href="/questions">Вопросы</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if active == 'history' %} active{% endif %}" href="/history">История</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if active == 'audit' %} active{% endif %}" href="/audit">Аудит</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success" role="alert">{{ success }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
